<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>Snapsend – Capture, style and send</title>
<style>
:root{--bg:#070a14;--a1:#7c5cff;--a2:#22d3ee;--a3:#ff5c93;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.14);
--edge:rgba(255,255,255,.16);--text:#f4f6ff;--muted:rgba(244,246,255,.62);--ok:#34d399;--bad:#fb7185;--shadow:0 18px 50px rgba(0,0,0,.45);
--grad:linear-gradient(120deg,var(--a1),var(--a3));--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme="light"]{--bg:#eef1ff;--a1:#5b3df5;--a2:#0ea5c6;--a3:#e8397a;--glass:rgba(255,255,255,.6);--glass2:rgba(255,255,255,.85);
--edge:rgba(255,255,255,.95);--text:#141a33;--muted:rgba(20,26,51,.6);--shadow:0 16px 40px rgba(60,70,140,.18)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;touch-action:manipulation;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;width:90vmax;height:90vmax;border-radius:50%;will-change:transform;animation:drift 24s ease-in-out infinite alternate}
.bg i:nth-child(1){left:-45vmax;top:-45vmax;background:radial-gradient(circle,color-mix(in srgb,var(--a1) 55%,transparent),transparent 62%)}
.bg i:nth-child(2){right:-50vmax;bottom:-50vmax;background:radial-gradient(circle,color-mix(in srgb,var(--a3) 45%,transparent),transparent 62%);animation-delay:-9s}
.bg i:nth-child(3){left:10vmax;top:30vh;width:60vmax;height:60vmax;background:radial-gradient(circle,color-mix(in srgb,var(--a2) 28%,transparent),transparent 62%);animation-delay:-15s}
@keyframes drift{to{transform:translate3d(8vmax,6vmax,0) scale(1.15)}}
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:var(--shadow)}
.app{position:relative;z-index:1;height:100%;height:100dvh;display:flex;flex-direction:column;max-width:960px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.2rem;letter-spacing:-.03em}
.logo{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--a1) 50%,transparent)}
.logo svg{width:18px;height:18px}
.pills{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;font-size:.76rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.off{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.dot.live{background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(.8)}}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text);cursor:pointer;border:1px solid var(--edge);background:var(--glass);transition:transform .15s var(--ease),background .2s}
.ib:active{transform:scale(.9)}.ib svg{width:19px;height:19px}
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;min-height:0}
.screen.active{display:flex;animation:enter .45s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.985)}}
.center{align-items:center;justify-content:center}

/* welcome */
.hero{width:100%;max-width:540px;border-radius:32px;padding:clamp(20px,4vw,34px);max-height:100%;overflow:auto}
.hero h1{font-size:clamp(1.9rem,6vw,2.7rem);letter-spacing:-.04em;line-height:1.05;margin-bottom:10px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);line-height:1.5;font-size:.95rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 14px}
.tile{appearance:none;font:inherit;color:var(--text);text-align:left;cursor:pointer;border-radius:24px;padding:18px 16px;border:1px solid var(--edge);background:var(--glass2);display:grid;gap:12px;position:relative;overflow:hidden;transition:transform .2s var(--ease),border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--a2)}.tile:active{transform:scale(.96)}
.tile .ti{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--grad)}
.tile.alt .ti{background:linear-gradient(120deg,var(--a2),var(--a1))}
.tile .ti svg{width:22px;height:22px}.tile b{font-size:1rem;letter-spacing:-.01em}.tile small{color:var(--muted);font-size:.78rem;line-height:1.3}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 5s 1s infinite}
@keyframes sheen{40%,100%{transform:translateX(120%)}}
.hint{font-size:.78rem;color:var(--muted);text-align:center;line-height:1.5}
.note{margin-top:10px;font-size:.82rem;color:var(--muted);text-align:center;min-height:1.1em}.note.err{color:var(--bad)}

/* stage */
.stage{width:100%;height:100%;display:flex;flex-direction:column;gap:10px;min-height:0;margin:0 auto;max-width:760px}
.frame{position:relative;flex:1;min-height:0;border-radius:30px;padding:6px;overflow:hidden}
.inner{position:relative;width:100%;height:100%;border-radius:24px;overflow:hidden;background:#000}
.inner video,.inner img{width:100%;height:100%;display:block;object-fit:cover}
.inner img{object-fit:contain;transition:opacity .25s}
.inner video.mirror{transform:scaleX(-1)}.inner img.flipped{transform:scaleX(-1)}
.badge{position:absolute;left:12px;top:12px;font-size:.74rem;padding:6px 11px;border-radius:99px;background:rgba(0,0,0,.45);color:#fff;backdrop-filter:blur(10px);display:flex;align-items:center;gap:7px}
.corner{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.45);color:#fff;border-color:transparent}
.grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 33%,rgba(255,255,255,.18) 33%,rgba(255,255,255,.18) calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,rgba(255,255,255,.18) 66%,rgba(255,255,255,.18) calc(66% + 1px),transparent calc(66% + 1px)),linear-gradient(90deg,transparent 33%,rgba(255,255,255,.18) 33%,rgba(255,255,255,.18) calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,rgba(255,255,255,.18) 66%,rgba(255,255,255,.18) calc(66% + 1px),transparent calc(66% + 1px));opacity:.7}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:flash .4s ease}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:center;appearance:none;font:inherit;color:var(--muted);cursor:pointer;background:none;border:0;display:grid;gap:5px;justify-items:center;font-size:.72rem;font-weight:600;transition:transform .25s var(--ease),color .2s}
.chip .th{width:56px;height:56px;border-radius:18px;overflow:hidden;border:2px solid transparent;background:linear-gradient(135deg,var(--a1),var(--a3));outline:1px solid var(--edge);transition:border-color .2s,transform .25s var(--ease)}
.chip .th img{width:100%;height:100%;object-fit:cover;display:block}
.chip.active{color:var(--text);transform:translateY(-2px)}.chip.active .th{border-color:var(--a2);transform:scale(1.08)}
.bar{display:flex;align-items:center;justify-content:space-around;padding:2px 0 4px}
.shutter{position:relative;width:78px;height:78px;border-radius:50%;border:0;background:none;padding:0;cursor:pointer;transition:transform .15s var(--ease)}
.shutter::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--a1),var(--a2),var(--a3),var(--a1));animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,transparent 60%,#000 61%);mask:radial-gradient(circle,transparent 60%,#000 61%)}
.shutter span{position:absolute;inset:9px;border-radius:50%;background:#fff;transition:transform .15s var(--ease)}
.shutter:active{transform:scale(.92)}.shutter:active span{transform:scale(.84)}
@keyframes spin{to{transform:rotate(360deg)}}
.big{width:52px;height:52px}

/* editor panel */
.tabs{display:flex;gap:4px;padding:4px;border-radius:99px;align-self:center;position:relative}
.tabs button{appearance:none;border:0;background:none;font:inherit;font-weight:600;font-size:.82rem;color:var(--muted);padding:8px 20px;border-radius:99px;cursor:pointer;position:relative;z-index:1;transition:color .2s}
.tabs button.on{color:#fff}
.tabs .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:99px;background:var(--grad);transition:transform .3s var(--ease)}
.tabs[data-t="1"] .knob{transform:translateX(100%)}
.pane{min-height:84px;display:flex;flex-direction:column;justify-content:center}
.sliders{display:grid;gap:8px;padding:0 6px}
.sl{display:grid;grid-template-columns:78px 1fr 36px;align-items:center;gap:10px;font-size:.8rem;color:var(--muted)}
.sl output{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:9px;background:var(--glass2)}
input[type=range]::-moz-range-track{height:5px;border-radius:9px;background:var(--glass2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8.5px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4),0 0 0 4px color-mix(in srgb,var(--a1) 55%,transparent)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4),0 0 0 4px color-mix(in srgb,var(--a1) 55%,transparent)}
.actions{display:flex;gap:10px;width:100%}
.btn{appearance:none;font:inherit;font-weight:700;cursor:pointer;color:var(--text);border-radius:18px;padding:14px 18px;background:var(--glass2);border:1px solid var(--edge);transition:transform .15s var(--ease),filter .2s;flex:1}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.95)}.btn:disabled{opacity:.5}
.btn.primary{flex:2;background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 10px 26px color-mix(in srgb,var(--a1) 45%,transparent)}
.btn:focus-visible,.ib:focus-visible,.shutter:focus-visible,.tile:focus-visible,.chip:focus-visible{outline:3px solid var(--a2);outline-offset:3px}

/* upload overlay */
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);z-index:5}
.overlay.show{display:flex;animation:enter .3s var(--ease)}
.panel{border-radius:26px;padding:24px;width:min(340px,100%);text-align:center}
.panel h3{margin-bottom:6px}.panel p{color:var(--muted);font-size:.88rem}
.track{height:8px;border-radius:9px;background:var(--glass2);overflow:hidden;margin:16px 0 10px}
.fill{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));background-size:200% 100%;animation:flow 1.2s linear infinite;transition:width .15s}
.fill.indet{width:35%;animation:slide 1.1s infinite ease-in-out,flow 1.2s linear infinite}
@keyframes slide{from{margin-left:-35%}to{margin-left:100%}}@keyframes flow{to{background-position:-200% 0}}
.res{width:68px;height:68px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;animation:pop .5s var(--ease)}
.res svg{width:34px;height:34px}.res path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .2s forwards}
.res.ok{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}.res.bad{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
@keyframes pop{from{transform:scale(.3);opacity:0}}@keyframes draw{to{stroke-dashoffset:0}}

/* drop veil + toasts */
.veil{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(10px);font-weight:700;font-size:1.2rem}
.veil div{padding:48px 56px;border:2px dashed var(--a2);border-radius:32px;animation:pulse 1.4s infinite}
body.drag .veil{display:grid}
#toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;display:grid;gap:8px;width:min(92vw,420px)}
.toast{padding:12px 16px;border-radius:16px;font-size:.88rem;animation:enter .3s var(--ease) both}
.toast.ok{border-left:4px solid var(--ok)}.toast.bad{border-left:4px solid var(--bad)}
.hidden{display:none!important}
@media (orientation:landscape) and (max-height:520px){
header{padding-bottom:4px}.app{padding:6px 10px}.stage{flex-direction:row;max-width:none}
.bar{flex-direction:column;width:70px}.chips{flex-direction:column;overflow-y:auto;width:72px}
.ed{width:300px;flex:none;overflow:auto}}
@media (max-width:560px){.pill .l{display:none}.pill{padding:10px}.tiles{gap:10px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="veil"><div>Drop your photo here</div></div>
<input type="file" id="file" accept="image/*" class="hidden">

<div class="app">
<header>
  <div class="brand"><span class="logo"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="26" height="18" rx="5"/><circle cx="16" cy="17" r="5"/></svg></span>Snapsend</div>
  <div class="pills">
    <div class="pill glass" role="status"><span class="dot" id="netDot"></span><span class="l" id="netL">Checking…</span></div>
    <div class="pill glass" role="status"><span class="dot" id="camDot"></span><span class="l" id="camL">Camera off</span></div>
    <button class="ib" id="themeBtn" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
</header>

<main>
  <section class="screen center active" id="s-welcome">
    <div class="hero glass">
      <h1>Shoot or pick a photo, style it, send it.</h1>
      <p>Your camera starts only when you tap Open camera. You review every photo before anything leaves your device.</p>
      <div class="tiles">
        <button class="tile" id="enableBtn"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span><b>Open camera</b><small>Take a new photo with live filters</small></button>
        <button class="tile alt" id="pickBtn"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></span><b>Upload photo</b><small>Choose from your gallery or files</small></button>
      </div>
      <div class="hint">You can also drop an image anywhere or paste one with Ctrl+V.</div>
      <div class="note" id="welcomeNote"></div>
    </div>
  </section>

  <section class="screen" id="s-camera">
    <div class="stage">
      <div class="frame glass"><div class="inner">
        <video id="video" playsinline muted autoplay></video>
        <div class="grid" id="grid"></div>
        <div class="badge"><span class="dot live"></span><span id="resBadge">Live</span></div>
        <button class="ib corner" id="stopBtn" aria-label="Turn camera off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <div class="flash" id="flash"></div>
      </div></div>
      <div class="chips" id="chipsCam" role="group" aria-label="Photo filters"></div>
      <div class="bar">
        <button class="ib big" id="galBtn" aria-label="Upload a photo instead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></button>
        <button class="shutter" id="captureBtn" aria-label="Capture photo"><span></span></button>
        <button class="ib big" id="switchBtn" aria-label="Switch camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-15.5-6.2L3 8M3 3v5h5M3 12a9 9 0 0 0 15.5 6.2L21 16M21 21v-5h-5"/></svg></button>
      </div>
    </div>
  </section>

  <section class="screen" id="s-review">
    <div class="stage">
      <div class="frame glass"><div class="inner">
        <img id="preview" alt="Photo preview">
        <div class="badge" id="metaBadge"></div>
        <div class="overlay" id="overlay"><div class="panel glass" id="panel"></div></div>
      </div></div>
      <div class="ed" style="display:grid;gap:10px;min-height:0">
        <div class="tabs glass" id="tabs" data-t="0"><span class="knob"></span><button class="on" data-t="0">Filters</button><button data-t="1">Adjust</button></div>
        <div class="pane">
          <div class="chips" id="chipsRev" role="group" aria-label="Photo filters"></div>
          <div class="sliders hidden" id="sliders">
            <label class="sl">Brightness<input type="range" id="rb" min="60" max="150" value="100"><output>0</output></label>
            <label class="sl">Contrast<input type="range" id="rc" min="60" max="150" value="100"><output>0</output></label>
            <label class="sl">Saturation<input type="range" id="rs" min="0" max="200" value="100"><output>0</output></label>
          </div>
        </div>
        <div class="actions" id="reviewActions">
          <button class="btn" id="retakeBtn">Retake</button>
          <button class="btn" id="flipBtn">Flip</button>
          <button class="btn primary" id="sendBtn">Save to gallery</button>
        </div>
      </div>
    </div>
  </section>
</main>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
/* CONFIG — your backend endpoint and limits. Never put secrets in this file. */
const CONFIG = {
  UPLOAD_API_URL: "https://snapsend-upload.sethilyaddehigetest.workers.dev",
  MAX_FILE_SIZE_MB: 10, IMAGE_QUALITY: 0.92, MAX_DIMENSION: 3840, UPLOAD_TIMEOUT_MS: 45000,
  PREFER_WEBP: false, FORM_FIELD_NAME: "photo", ALLOWED_TYPES: ["image/jpeg", "image/webp"]
};

const $ = id => document.getElementById(id);
const state = { stream: null, facing: "environment", blob: null, url: null, raw: null, flip: false, source: "camera", filter: "none", adj: { b: 100, c: 100, s: 100 }, captureId: null, capturedAt: null, xhr: null, uploading: false };
const screens = ["welcome", "camera", "review"];
const show = n => screens.forEach(s => $("s-" + s).classList.toggle("active", s === n));
const newId = () => crypto.randomUUID ? crypto.randomUUID() : "c-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const toBlob = (c, t, q) => new Promise(r => c.toBlob(r, t, q));
function toast(m, t = "ok", ms = 3500){ const e = document.createElement("div"); e.className = "toast glass " + t; e.textContent = m; $("toasts").appendChild(e); setTimeout(() => e.remove(), ms); }
function camStatus(on, t){ $("camDot").className = "dot " + (on ? "on" : ""); $("camL").textContent = t; }
const buzz = n => navigator.vibrate && navigator.vibrate(n);

/* theme + network */
document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
$("themeBtn").onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; };
function net(){ const on = navigator.onLine; $("netDot").className = "dot " + (on ? "on" : "off"); $("netL").textContent = on ? "Online" : "Offline"; }
addEventListener("online", () => { net(); toast("Back online"); });
addEventListener("offline", () => { net(); toast("You are offline", "bad"); });
net();

/* ---------- filters: one matrix drives the live preview and the saved photo ---------- */
function mk(o){
  const { sat = 1, sep = 0, gray = 0, bri = 1, con = 1, off = 0, tint = [1, 1, 1] } = o;
  const mm = (A, B) => { const R = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) R.push(A[i*3]*B[j] + A[i*3+1]*B[3+j] + A[i*3+2]*B[6+j]); return R; };
  const S = [.213+.787*sat,.715-.715*sat,.072-.072*sat,.213-.213*sat,.715+.285*sat,.072-.072*sat,.213-.213*sat,.715-.715*sat,.072+.928*sat];
  const k = 1 - sep, P = [.393+.607*k,.769-.769*k,.189-.189*k,.349-.349*k,.686+.314*k,.168-.168*k,.272-.272*k,.534-.534*k,.131+.869*k];
  const g = 1 - gray, G = [.2126+.7874*g,.7152-.7152*g,.0722-.0722*g,.2126-.2126*g,.7152+.2848*g,.0722-.0722*g,.2126-.2126*g,.7152-.7152*g,.0722+.9278*g];
  const M = mm(G, mm(P, S));
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) M[i*3+j] *= bri * tint[i] * con;
  return { m: M, o: .5 * (1 - con) + off };
}
const FILTERS = [
  { id: "none", name: "Original", ...mk({}) },
  { id: "vivid", name: "Vivid", ...mk({ sat: 1.4, con: 1.08 }) },
  { id: "warm", name: "Warm", ...mk({ sat: 1.15, bri: 1.03, tint: [1.08, 1, .9] }) },
  { id: "cool", name: "Cool", ...mk({ sat: 1.1, tint: [.92, 1, 1.1] }) },
  { id: "dreamy", name: "Dreamy", ...mk({ sat: 1.2, bri: 1.08, con: .92, off: .02, tint: [1.04, 1, 1.04] }) },
  { id: "vintage", name: "Vintage", ...mk({ sat: .9, sep: .45, con: .92, off: .03 }) },
  { id: "fade", name: "Fade", ...mk({ sat: .8, con: .85, bri: 1.06, off: .05 }) },
  { id: "pop", name: "Pop", ...mk({ sat: 1.7, con: 1.2 }) },
  { id: "mono", name: "Mono", ...mk({ gray: 1, con: 1.15 }) },
  { id: "noir", name: "Noir", ...mk({ gray: 1, con: 1.4, bri: .95 }) }
];
document.body.insertAdjacentHTML("beforeend", '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>' +
  FILTERS.map(f => '<filter id="f-' + f.id + '" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="' +
    [0, 1, 2].map(i => f.m.slice(i*3, i*3+3).join(" ") + " 0 " + f.o).join(" ") + ' 0 0 0 1 0"/></filter>').join("") + '</defs></svg>');

const isDefaultAdj = () => state.adj.b === 100 && state.adj.c === 100 && state.adj.s === 100;
function cssLook(){
  const p = [];
  if (state.filter !== "none") p.push("url(#f-" + state.filter + ")");
  if (!isDefaultAdj()) p.push("brightness(" + state.adj.b / 100 + ") contrast(" + state.adj.c / 100 + ") saturate(" + state.adj.s / 100 + ")");
  return p.join(" ") || "none";
}
function applyLook(){
  const f = cssLook();
  $("video").style.filter = f; $("preview").style.filter = f;
  $("preview").classList.toggle("flipped", !!state.flip);
  document.querySelectorAll(".chip").forEach(b => b.classList.toggle("active", b.dataset.id === state.filter));
}
["chipsCam", "chipsRev"].forEach(id => FILTERS.forEach(f => {
  const b = document.createElement("button");
  b.className = "chip"; b.dataset.id = f.id;
  b.innerHTML = '<span class="th"><img alt="" style="filter:' + (f.id === "none" ? "none" : "url(#f-" + f.id + ")") + '"></span>' + f.name;
  b.onclick = () => { state.filter = f.id; applyLook(); buzz(8); b.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" }); };
  $(id).appendChild(b);
}));
/* tiny snapshot so every filter chip shows the real photo */
function makeThumbs(src, w, h){
  const c = document.createElement("canvas"), s = 112 / Math.min(w, h);
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  const u = c.toDataURL("image/jpeg", .7);
  document.querySelectorAll(".chip img").forEach(i => i.src = u);
}
applyLook();

/* sliders */
[["rb", "b"], ["rc", "c"], ["rs", "s"]].forEach(([id, k]) => {
  const el = $(id), out = el.nextElementSibling;
  const upd = () => { state.adj[k] = +el.value; out.textContent = el.value - 100 > 0 ? "+" + (el.value - 100) : el.value - 100; applyLook(); };
  el.oninput = upd; el.ondblclick = () => { el.value = 100; upd(); }; upd();
});
$("tabs").onclick = e => {
  const t = e.target.closest("button"); if (!t) return;
  $("tabs").dataset.t = t.dataset.t;
  [...$("tabs").querySelectorAll("button")].forEach(b => b.classList.toggle("on", b === t));
  $("chipsRev").classList.toggle("hidden", t.dataset.t === "1");
  $("sliders").classList.toggle("hidden", t.dataset.t === "0");
};

/* ---------- camera ---------- */
function camError(e){
  switch (e && e.name){
    case "NotAllowedError": case "SecurityError": return "Camera permission was denied. Allow camera access in your browser's site settings, or upload a photo instead.";
    case "NotFoundError": case "OverconstrainedError": return "No suitable camera was found. You can upload a photo instead.";
    case "NotReadableError": case "AbortError": return "The camera is busy. Close other apps using it and try again.";
    default: return "Could not start the camera (" + ((e && e.name) || "unknown error") + ").";
  }
}
async function startCamera(){
  stopCamera(); camStatus(false, "Starting…");
  const hi = { width: { ideal: 4096 }, height: { ideal: 2160 } };
  try {
    try { state.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: state.facing }, ...hi } }); }
    catch (e){ if (e.name === "OverconstrainedError") state.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true }); else throw e; }
  } catch (e){
    camStatus(false, "Camera off"); const m = camError(e);
    $("welcomeNote").className = "note err"; $("welcomeNote").textContent = m; toast(m, "bad", 6000); show("welcome"); return false;
  }
  state.source = "camera";
  const v = $("video"); v.srcObject = state.stream; await v.play().catch(() => {});
  const tr = state.stream.getVideoTracks()[0];
  try { const caps = tr.getCapabilities ? tr.getCapabilities() : {}; if (caps.focusMode && caps.focusMode.includes("continuous")) await tr.applyConstraints({ advanced: [{ focusMode: "continuous" }] }); } catch {}
  const s = tr.getSettings();
  v.classList.toggle("mirror", (s.facingMode || state.facing) === "user");
  $("resBadge").textContent = (s.width && s.height) ? s.width + " × " + s.height : "Live";
  camStatus(true, "Camera on");
  tr.addEventListener("ended", () => { camStatus(false, "Camera off"); if ($("s-camera").classList.contains("active")){ toast("Camera disconnected", "bad"); show("welcome"); } });
  try { $("switchBtn").classList.toggle("hidden", (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput").length < 2); } catch { $("switchBtn").classList.add("hidden"); }
  show("camera");
  setTimeout(() => { if (v.videoWidth && state.stream) makeThumbs(v, v.videoWidth, v.videoHeight); }, 500);
  return true;
}
function stopCamera(){ if (state.stream){ state.stream.getTracks().forEach(t => t.stop()); state.stream = null; } $("video").srcObject = null; camStatus(false, "Camera off"); }

$("enableBtn").onclick = async () => {
  const b = $("enableBtn"); b.disabled = true; $("welcomeNote").className = "note"; $("welcomeNote").textContent = "Waiting for permission…";
  await startCamera(); b.disabled = false; if ($("s-welcome").classList.contains("active") === false) $("welcomeNote").textContent = "";
};
$("switchBtn").onclick = () => { state.facing = state.facing === "user" ? "environment" : "user"; startCamera(); };
$("stopBtn").onclick = () => { stopCamera(); show("welcome"); };
document.addEventListener("visibilitychange", () => {
  const on = $("s-camera").classList.contains("active");
  if (document.hidden && on) stopCamera(); else if (!document.hidden && on && !state.stream) startCamera();
});
(function env(){
  const n = $("welcomeNote");
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    n.className = "note err"; n.textContent = "Camera is not available here (it needs HTTPS and a supported browser). You can still upload a photo.";
    $("enableBtn").disabled = true; $("enableBtn").style.opacity = .5;
  }
})();

/* ---------- photo in: camera capture or uploaded file ---------- */
function setPhoto(c, source, shownBlob){
  state.raw = c; state.blob = null; state.captureId = newId(); state.capturedAt = new Date().toISOString();
  state.source = source;
  if (state.url) URL.revokeObjectURL(state.url);
  state.url = URL.createObjectURL(shownBlob);
  $("preview").src = state.url;
  $("metaBadge").textContent = c.width + " × " + c.height;
  $("retakeBtn").textContent = source === "camera" ? "Retake" : "Replace";
  makeThumbs(c, c.width, c.height);
  applyLook(); $("overlay").classList.remove("show"); $("reviewActions").classList.remove("hidden");
  show("review");
}
function clearPhoto(){ if (state.url) URL.revokeObjectURL(state.url); state.blob = state.url = state.raw = null; state.flip = false; $("preview").removeAttribute("src"); }

$("captureBtn").onclick = async () => {
  const v = $("video");
  if (!state.stream || !v.videoWidth){ toast("Camera is not ready yet", "bad"); return; }
  const btn = $("captureBtn"); btn.disabled = true;
  try {
    const mir = v.classList.contains("mirror"); let src = v, sw = v.videoWidth, sh = v.videoHeight;
    try { if ("ImageCapture" in window){ const bmp = await createImageBitmap(await new ImageCapture(state.stream.getVideoTracks()[0]).takePhoto()); if (Math.abs(bmp.width / bmp.height - sw / sh) < .03 * (sw / sh)){ src = bmp; sw = bmp.width; sh = bmp.height; } } } catch {}
    const sc = Math.min(1, CONFIG.MAX_DIMENSION / Math.max(sw, sh)), c = document.createElement("canvas");
    c.width = Math.round(sw * sc); c.height = Math.round(sh * sc);
    const x = c.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(src, 0, 0, c.width, c.height);
    const f = $("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); buzz(15);
    const shown = await toBlob(c, "image/jpeg", .9);
    if (!shown){ toast("Could not process the photo. Please retake.", "bad"); return; }
    stopCamera(); state.flip = mir; setPhoto(c, "camera", shown);
  } finally { btn.disabled = false; }
};

async function loadFile(file){
  if (!file) return;
  if (!/^image\//.test(file.type)){ toast("Please choose an image file.", "bad"); return; }
  try {
    let bmp; try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); } catch { bmp = await createImageBitmap(file); }
    const sc = Math.min(1, CONFIG.MAX_DIMENSION / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas");
    c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    const x = c.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(bmp, 0, 0, c.width, c.height);
    const shown = await toBlob(c, "image/jpeg", .9);
    stopCamera(); state.flip = false; setPhoto(c, "upload", shown); buzz(10);
  } catch { toast("That image could not be opened. Try a JPG or PNG.", "bad"); }
}
const pick = () => { $("file").value = ""; $("file").click(); };
$("pickBtn").onclick = pick; $("galBtn").onclick = pick;
$("file").onchange = e => loadFile(e.target.files[0]);
let dragN = 0;
addEventListener("dragenter", e => { if ([...e.dataTransfer.types].includes("Files")){ dragN++; document.body.classList.add("drag"); } });
addEventListener("dragleave", () => { if (--dragN <= 0){ dragN = 0; document.body.classList.remove("drag"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); dragN = 0; document.body.classList.remove("drag"); loadFile(e.dataTransfer.files[0]); });
addEventListener("paste", e => { const f = [...(e.clipboardData ? e.clipboardData.files : [])].find(x => /^image\//.test(x.type)); if (f) loadFile(f); });

$("flipBtn").onclick = () => { state.flip = !state.flip; applyLook(); };
$("retakeBtn").onclick = async () => { const s = state.source; clearPhoto(); if (s === "camera") await startCamera(); else { show("welcome"); pick(); } };

/* ---------- build final image: raw -> flip -> filter -> adjust -> compress ---------- */
async function finalize(){
  const r = state.raw, f = FILTERS.find(x => x.id === state.filter), a = state.adj;
  const c = document.createElement("canvas"); c.width = r.width; c.height = r.height;
  const x = c.getContext("2d");
  if (state.flip){ x.translate(c.width, 0); x.scale(-1, 1); }
  x.drawImage(r, 0, 0); x.setTransform(1, 0, 0, 1, 0, 0);
  if (f.id !== "none" || !isDefaultAdj()){
    const img = x.getImageData(0, 0, c.width, c.height), d = img.data, m = f.m, o = f.o * 255, none = f.id === "none";
    const B = a.b / 100, C = a.c / 100, S = a.s / 100;
    for (let i = 0; i < d.length; i += 4){
      let R = d[i], G = d[i+1], Bl = d[i+2];
      if (!none){ const r2 = m[0]*R + m[1]*G + m[2]*Bl + o, g2 = m[3]*R + m[4]*G + m[5]*Bl + o, b2 = m[6]*R + m[7]*G + m[8]*Bl + o; R = r2; G = g2; Bl = b2; }
      R *= B; G *= B; Bl *= B;
      R = (R - 127.5) * C + 127.5; G = (G - 127.5) * C + 127.5; Bl = (Bl - 127.5) * C + 127.5;
      const l = .213*R + .715*G + .072*Bl;
      d[i] = l + (R - l) * S; d[i+1] = l + (G - l) * S; d[i+2] = l + (Bl - l) * S;
    }
    x.putImageData(img, 0, 0);
  }
  let type = "image/jpeg";
  if (CONFIG.PREFER_WEBP){ const p = await toBlob(document.createElement("canvas"), "image/webp", .5); if (p && p.type === "image/webp") type = "image/webp"; }
  const limit = CONFIG.MAX_FILE_SIZE_MB * 1048576; let q = CONFIG.IMAGE_QUALITY, b = await toBlob(c, type, q);
  while (b && b.size > limit && q > .5){ q -= .1; b = await toBlob(c, type, q); }
  state.blob = b;
}

/* ---------- upload ---------- */
function validate(){
  if (!state.blob) return "There is no photo to send.";
  if (!CONFIG.ALLOWED_TYPES.includes(state.blob.type)) return "Unsupported image type: " + state.blob.type;
  if (state.blob.size > CONFIG.MAX_FILE_SIZE_MB * 1048576) return "The photo is larger than " + CONFIG.MAX_FILE_SIZE_MB + " MB. Try a smaller image.";
  if (!navigator.onLine) return "You are offline. Reconnect and try again.";
  if (!CONFIG.UPLOAD_API_URL || CONFIG.UPLOAD_API_URL.startsWith("YOUR_")) return "The upload endpoint is not set. Edit CONFIG.UPLOAD_API_URL in the code.";
  if (!/^https:\/\//i.test(CONFIG.UPLOAD_API_URL) && !/^http:\/\/localhost/i.test(CONFIG.UPLOAD_API_URL)) return "The upload endpoint must use HTTPS.";
  return null;
}
function panel(h){ $("panel").innerHTML = h; $("overlay").classList.add("show"); $("reviewActions").classList.add("hidden"); }
const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const ICON_BAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
function fail(msg){
  state.uploading = false;
  panel('<div class="res bad">' + ICON_BAD + '</div><h3>Upload failed</h3><p id="errMsg"></p><div class="actions" style="margin-top:18px"><button class="btn" id="backBtn">Edit photo</button><button class="btn primary" id="retryBtn">Try again</button></div>');
  $("errMsg").textContent = msg; $("retryBtn").onclick = sendPhoto;
  $("backBtn").onclick = () => { $("overlay").classList.remove("show"); $("reviewActions").classList.remove("hidden"); };
  toast(msg, "bad", 5000); buzz([30, 40, 30]);
}
function done(){
  state.uploading = false;
  panel('<div class="res ok">' + ICON_OK + '</div><h3>Saved to gallery</h3><p>Your photo was uploaded.</p><div class="actions" style="margin-top:18px"><button class="btn primary" id="againBtn">Add another photo</button></div>');
  $("againBtn").onclick = () => { clearPhoto(); show("welcome"); };
  toast("Saved to gallery"); buzz(25);
}
async function sendPhoto(){
  if (state.uploading) return; state.uploading = true;
  panel('<h3>Preparing photo…</h3><p>Applying your look</p><div class="track"><div class="fill indet"></div></div>');
  await new Promise(r => setTimeout(r, 30));
  try { await finalize(); } catch { fail("Could not process the photo. Try again."); return; }
  state.uploading = false; const problem = validate(); if (problem){ fail(problem); return; }
  state.uploading = true;
  const ext = state.blob.type === "image/webp" ? "webp" : "jpg", fd = new FormData();
  fd.append(CONFIG.FORM_FIELD_NAME, state.blob, "capture-" + state.captureId + "." + ext);
  fd.append("captureId", state.captureId); fd.append("capturedAt", state.capturedAt); fd.append("mimeType", state.blob.type);
  panel('<h3>Uploading…</h3><p id="pct">Starting upload</p><div class="track"><div class="fill indet" id="fill"></div></div><button class="btn" id="cancelBtn" style="width:100%;margin-top:4px">Cancel</button>');
  const xhr = state.xhr = new XMLHttpRequest();
  xhr.open("POST", CONFIG.UPLOAD_API_URL); xhr.timeout = CONFIG.UPLOAD_TIMEOUT_MS;
  xhr.upload.onprogress = e => {
    if (!e.lengthComputable) return; const p = Math.round(e.loaded / e.total * 100), fl = $("fill"); if (!fl) return;
    fl.classList.remove("indet"); fl.style.width = p + "%"; $("pct").textContent = p < 100 ? p + "% uploaded" : "Finishing up…";
  };
  xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? done() : fail("The server rejected the upload (status " + xhr.status + ").");
  xhr.onerror = () => fail("Network error. Check your connection and the server's CORS settings.");
  xhr.ontimeout = () => fail("The upload timed out. Check your connection and try again.");
  xhr.onabort = () => { state.uploading = false; $("overlay").classList.remove("show"); $("reviewActions").classList.remove("hidden"); toast("Upload cancelled"); };
  $("cancelBtn").onclick = () => xhr.abort();
  xhr.send(fd);
}
$("sendBtn").onclick = sendPhoto;
addEventListener("pagehide", () => { stopCamera(); if (state.xhr && state.uploading) state.xhr.abort(); });
</script>
